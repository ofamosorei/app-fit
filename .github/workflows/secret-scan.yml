name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install verified scanner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          printf '[extend]\nuseDefault = true\n' > gitleaks-audit.toml
          touch gitleaks-empty-ignore
      - name: Scan every new commit without logging secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            range="$HEAD_SHA"
          else
            git cat-file -e "$BASE_SHA^{commit}"
            if [[ "$EVENT_NAME" == pull_request ]]; then
              BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            fi
            range="$BASE_SHA..$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git . \
            --config "$RUNNER_TEMP/gitleaks-audit.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-empty-ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner \
            --max-archive-depth 2 --max-decode-depth 5 \
            --log-opts="--full-history -m $range"
